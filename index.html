<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portale</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --fg: #1a1d24;
      --accent: #3b5bdb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a;
        --fg: #eef0f5;
        --accent: #748ffc;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    h1 {
      font-size: clamp(3rem, 12vw, 8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>hello</h1>
  </main>
</body>
</html>
