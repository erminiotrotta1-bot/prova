<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concept loghi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:32px 16px;font-family:Montserrat,Arial,sans-serif;background:#F4F6FA;color:#1B2B4A}
h1{font-size:22px;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:24px}
figure{margin:0;background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden}
.tile{display:flex;align-items:center;justify-content:center;padding:28px;min-height:180px}
.tile img{max-width:100%;height:auto}
.dark{background:#0E1B33}
.dark img{filter:brightness(1.6) saturate(1.1)}
figcaption{padding:12px 18px;font-weight:700;font-size:14px}
</style></head><body>
<h1>Allianz202 Network — concept loghi</h1>
<div class="grid">
<figure><div class="tile light"><img src="01-esagono-rete.svg" alt="Esagono rete"></div><div class="tile dark"><img src="01-esagono-rete.svg" alt="Esagono rete su fondo scuro"></div><figcaption>01 · Esagono rete</figcaption></figure>
<figure><div class="tile light"><img src="02-onde-segnale.svg" alt="Onde segnale"></div><div class="tile dark"><img src="02-onde-segnale.svg" alt="Onde segnale su fondo scuro"></div><figcaption>02 · Onde segnale</figcaption></figure>
<figure><div class="tile light"><img src="03-scudo-connesso.svg" alt="Scudo connesso"></div><div class="tile dark"><img src="03-scudo-connesso.svg" alt="Scudo connesso su fondo scuro"></div><figcaption>03 · Scudo connesso</figcaption></figure>
<figure><div class="tile light"><img src="04-globo-nodi.svg" alt="Globo nodi"></div><div class="tile dark"><img src="04-globo-nodi.svg" alt="Globo nodi su fondo scuro"></div><figcaption>04 · Globo nodi</figcaption></figure>
<figure><div class="tile light"><img src="05-monogramma-202.svg" alt="Monogramma 202"></div><div class="tile dark"><img src="05-monogramma-202.svg" alt="Monogramma 202 su fondo scuro"></div><figcaption>05 · Monogramma 202</figcaption></figure>
<figure><div class="tile light"><img src="06-a-nodi.svg" alt="A di nodi"></div><div class="tile dark"><img src="06-a-nodi.svg" alt="A di nodi su fondo scuro"></div><figcaption>06 · A di nodi</figcaption></figure>
</div></body></html>
